app:
  name: tg-filer safe demo
  demo_mode: true

telegram:
  framework: python-telegram-bot
  bot_token_env: TG_FILER_BOT_TOKEN
  owner_user_ids:
    - 123456789

filesystem:
  roots:
    demo:
      display_name: Safe Demo Files
      path: ./demo-data
  max_preview_bytes: 12000
  max_upload_bytes: 45000000
  search_result_limit: 10
  content_search_max_bytes: 250000
  search_snippet_chars: 160
  searchable_extensions:
    - .csv
    - .json
    - .md
    - .txt
    - .yaml
  search_exclude_names:
    - .git
    - .env
    - .env.*
    - __pycache__
  show_hidden_files: false
  oversized_file_action: metadata_and_compress
  delete_mode: trash
  trash_directory: ./demo-trash

logging:
  audit_log_path: ./data/demo-audit.jsonl
