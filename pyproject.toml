[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tg-filer"
version = "0.1.0"
description = "Private Telegram bot for browsing allowlisted laptop folders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[socks]>=21,<23",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
tg-filer = "telegram_laptop_files.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_laptop_files"]
