app:
  name: tg-filer
  demo_mode: true

telegram:
  framework: python-telegram-bot
  bot_token_env: TG_FILER_BOT_TOKEN
  owner_user_ids:
    - 123456789

filesystem:
  roots:
    documents:
      display_name: My Documents
      # Relative paths are resolved from this config file's directory.
      # Replace this example with an existing folder you explicitly allow.
      path: ./demo-data
  max_preview_bytes: 12000
  max_upload_bytes: 45000000
  search_result_limit: 5
  content_search_max_bytes: 250000
  search_snippet_chars: 160
  searchable_extensions:
    - .cfg
    - .conf
    - .csv
    - .css
    - .html
    - .ini
    - .js
    - .json
    - .log
    - .md
    - .py
    - .rst
    - .toml
    - .ts
    - .txt
    - .xml
    - .yaml
    - .yml
  search_exclude_names:
    - .git
    - .venv
    - venv
    - __pycache__
    - .pytest_cache
    - node_modules
    - dist
    - build
    - .env
    - .env.*
  show_hidden_files: true
  oversized_file_action: metadata_and_compress
  delete_mode: trash
  # Demo deletions stay inside this ignored, disposable directory.
  # Remove this setting to use the operating system's normal trash.
  trash_directory: ./demo-trash

logging:
  audit_log_path: ./data/audit.jsonl
